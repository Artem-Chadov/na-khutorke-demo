<!doctype html>
<html lang="ru" data-legacy-page="zaly.html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#23362b">
  <title>На Хуторке</title>
  <script>
    (() => {
      const previous = new URL(location.href);
      const hash = new URLSearchParams(previous.hash.slice(1));
      const keyed = hash.has('p');
      const oldSection = keyed ? hash.get('at') : previous.hash.slice(1);
      const next = new URL('index.html', previous);
      next.search = previous.search;
      let section = 'zaly';
      if (section === 'zaly' && ['russkiy', 'turetskiy', 'privat'].includes(oldSection)) {
        next.searchParams.set('zal', oldSection);
      } else if (section === 'zaly' && ['ceny', 'tariff-title', 'faq-title'].includes(oldSection)) {
        section = 'ceny';
      } else if (section === 'kottedzh' && ['kontakty', 'visit-title'].includes(oldSection)) {
        section = 'kontakty';
      }
      if (section === 'zapis' && keyed) {
        for (const name of ['zal', 'gosti']) {
          if (hash.has(name)) next.searchParams.set(name, hash.get(name));
        }
      }
      next.hash = keyed ? new URLSearchParams({ p: hash.get('p'), at: section }).toString() : section;
      location.replace(next.href);
    })();
  </script>
</head>
<body><main><a href="index.html#zaly">Открыть раздел на главной усадьбы</a></main></body>
</html>
